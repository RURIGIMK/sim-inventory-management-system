services:
  postgres:
    image: postgres:16
    container_name: sim-inventory-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sim_inventory
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"
    volumes:
      - sim_inventory_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sim_inventory"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sim_inventory_data:
