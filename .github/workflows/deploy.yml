name: Deploy

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy API and frontend
    if: ${{ github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify deployment configuration
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          BOOTSTRAP_ADMIN_EMAIL: ${{ secrets.BOOTSTRAP_ADMIN_EMAIL }}
          JWT_SIGNING_KEY: ${{ secrets.JWT_SIGNING_KEY }}
          MFA_ENCRYPTION_KEY: ${{ secrets.MFA_ENCRYPTION_KEY }}
          NEON_CONNECTION_STRING: ${{ secrets.NEON_CONNECTION_STRING }}
          GOOGLE_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUD_RUN_REGION: ${{ vars.CLOUD_RUN_REGION }}
          CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          CORS_ALLOWED_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS }}
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
        run: |
          set -euo pipefail
          for name in GOOGLE_OAUTH_CLIENT_ID BOOTSTRAP_ADMIN_EMAIL JWT_SIGNING_KEY MFA_ENCRYPTION_KEY NEON_CONNECTION_STRING GOOGLE_WORKLOAD_IDENTITY_PROVIDER GOOGLE_SERVICE_ACCOUNT GOOGLE_CLOUD_PROJECT CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUD_RUN_REGION CLOUD_RUN_SERVICE CLOUDFLARE_PAGES_PROJECT CORS_ALLOWED_ORIGINS NEXT_PUBLIC_API_BASE_URL; do
            if [ -z "${!name}" ]; then echo "Missing required secret or variable: $name" >&2; exit 1; fi
          done
          if [ "${#JWT_SIGNING_KEY}" -lt 32 ]; then echo "JWT_SIGNING_KEY must be at least 32 characters." >&2; exit 1; fi
          python - <<'PY'
          import base64, os
          key = base64.b64decode(os.environ["MFA_ENCRYPTION_KEY"], validate=True)
          if len(key) != 32:
              raise SystemExit("MFA_ENCRYPTION_KEY must be base64 for exactly 32 random bytes.")
          PY

      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GOOGLE_CLOUD_PROJECT }}

      - name: Deploy .NET API to Cloud Run
        env:
          NEON_CONNECTION_STRING: ${{ secrets.NEON_CONNECTION_STRING }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          BOOTSTRAP_ADMIN_EMAIL: ${{ secrets.BOOTSTRAP_ADMIN_EMAIL }}
          JWT_SIGNING_KEY: ${{ secrets.JWT_SIGNING_KEY }}
          MFA_ENCRYPTION_KEY: ${{ secrets.MFA_ENCRYPTION_KEY }}
          CORS_ALLOWED_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS }}
          CLOUD_RUN_REGION: ${{ vars.CLOUD_RUN_REGION }}
          CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
        run: |
          set -euo pipefail
          gcloud run deploy "$CLOUD_RUN_SERVICE" \
            --source src/backend/SimInventory.Api \
            --project "${{ secrets.GOOGLE_CLOUD_PROJECT }}" \
            --region "$CLOUD_RUN_REGION" \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --set-env-vars "ConnectionStrings__DefaultConnection=$NEON_CONNECTION_STRING,Authentication__GoogleClientId=$GOOGLE_OAUTH_CLIENT_ID,Authentication__BootstrapAdminEmail=$BOOTSTRAP_ADMIN_EMAIL,Authentication__JwtSigningKey=$JWT_SIGNING_KEY,Authentication__MfaEncryptionKey=$MFA_ENCRYPTION_KEY,Cors__AllowedOrigins=$CORS_ALLOWED_ORIGINS"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build static frontend
        working-directory: src/frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
        run: |
          npm install
          npm run lint
          npm run build

      - name: Deploy static frontend to Cloudflare Pages
        working-directory: src/frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          npx wrangler pages deploy out --project-name "$CLOUDFLARE_PAGES_PROJECT" --branch main
