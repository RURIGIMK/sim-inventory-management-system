name: Deploy

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy-api:
    name: Validate frontend and deploy API
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify deployment configuration
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          RENDER_API_BASE_URL: ${{ vars.RENDER_API_BASE_URL }}
        run: |
          set -euo pipefail
          for name in GOOGLE_OAUTH_CLIENT_ID RENDER_DEPLOY_HOOK_URL RENDER_API_BASE_URL; do
            if [ -z "${!name}" ]; then echo "Missing required secret or variable: $name" >&2; exit 1; fi
          done
          case "$RENDER_API_BASE_URL" in https://*) ;; *) echo "RENDER_API_BASE_URL must use HTTPS." >&2; exit 1;; esac

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate frontend build
        working-directory: src/frontend
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          RENDER_API_BASE_URL: ${{ vars.RENDER_API_BASE_URL }}
        run: |
          set -euo pipefail
          export NEXT_PUBLIC_API_BASE_URL="$RENDER_API_BASE_URL"
          export NEXT_PUBLIC_GOOGLE_CLIENT_ID="$GOOGLE_OAUTH_CLIENT_ID"
          npm install
          npm run lint
          npm run build

      - name: Trigger Render API deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Verify deployed API health
        env:
          RENDER_API_BASE_URL: ${{ vars.RENDER_API_BASE_URL }}
        run: |
          set -euo pipefail
          api_base="${RENDER_API_BASE_URL%/}"
          for attempt in $(seq 1 60); do
            status="$(curl --silent --output /tmp/sim-api-health.json --write-out '%{http_code}' --max-time 10 "$api_base/api/health" || true)"
            if [ "$status" = "200" ] && grep -q '"status":"ok"' /tmp/sim-api-health.json; then
              echo "API health check passed."
              cat /tmp/sim-api-health.json
              exit 0
            fi
            echo "API health check attempt $attempt/60 did not pass (HTTP ${status:-unknown}); waiting 10 seconds."
            sleep 10
          done
          echo "API did not become healthy within 10 minutes." >&2
          exit 1
