name: CI

on:
  push:
    branches: ["main", "develop", "feature/**", "fix/**"]
  pull_request:
    branches: ["main", "develop"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: .NET 8 build and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        run: dotnet restore src/backend/SimInventory.Api/SimInventory.Api.csproj
      - name: Build API
        run: dotnet build src/backend/SimInventory.Api/SimInventory.Api.csproj --configuration Release --no-restore
      - name: Test
        run: dotnet test tests/SimInventory.Api.Tests/SimInventory.Api.Tests.csproj --configuration Release

  frontend:
    name: Frontend type-check and static build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/frontend/package.json
      - name: Install dependencies
        run: npm install
      - name: Audit frontend dependency tree
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node -e 'const a=require("/tmp/npm-audit.json"); for (const [name, item] of Object.entries(a.vulnerabilities || {})) console.log(JSON.stringify({name, severity:item.severity, direct:item.isDirect, range:item.range, fixAvailable:item.fixAvailable, via:item.via.map(v => typeof v === "string" ? v : v.title)}))'
          npm audit --audit-level=high
      - name: Type-check
        run: npm run lint
      - name: Build static frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.example.invalid
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: example-client-id.apps.googleusercontent.com
        run: npm run build
